  <!--
    [品牌资产] Antiona 标志（v2）：圆形蓝色渐变徽章 + Quicksand 字形轮廓。
    相较 v1 的圆角方块，圆形徽章在胶囊页头里更轻、更贴合「软软呼呼」的气质，
    并与方形 favicon 磁贴形成对比，便于在不同尺寸下辨认。
    字形来自 Quicksand (SIL Open Font License 1.1)，已转为路径，运行时不依赖字体。
  -->
  <title id="brand-title">Antiona</title>
  <desc id="brand-desc">蓝色渐变圆形徽章中的白色字母 A 与星芒，右侧为 Antiona 字标。</desc>
