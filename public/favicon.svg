<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="favicon-title">
  <!--
    [品牌资产] 标签页图标：蓝色渐变圆角方块 + 白色 A + 星光。
    与 src/assets/svg/logo.svg 共用同一套品牌形状，保证 logo 与 favicon 一致。
  -->
  <title id="favicon-title">Antiona</title>
  <defs>
    <linearGradient id="favicon-gradient" x1="16" y1="4" x2="112" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b5fd1"/>
      <stop offset="0.55" stop-color="#2f7cf6"/>
      <stop offset="1" stop-color="#58b8ff"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#favicon-gradient)"/>
  <path d="M30 99 L64 28 L98 99" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M43 76 H85" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
  <path d="M100 30 l3.4 8.2 8.2 3.4 -8.2 3.4 -3.4 8.2 -3.4 -8.2 -8.2 -3.4 8.2 -3.4 Z" fill="#bfe9ff"/>
</svg>
