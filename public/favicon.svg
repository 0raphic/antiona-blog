    <circle cx="64" cy="64" r="49" fill="none" stroke="url(#brand-sheen)" stroke-width="3" opacity="0.55"/>
    <path d="M38 92 L64 35 L90 92" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M47.5 74 H80.5" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <path d="M96.5 18.5 l3.4 8.2 8.2 3.4 -8.2 3.4 -3.4 8.2 -3.4 -8.2 -8.2 -3.4 8.2 -3.4 Z" fill="#bfe9ff"/>
