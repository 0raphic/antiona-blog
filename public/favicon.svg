<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="icon-title">
  <!-- [品牌资产] 标签页图标：与页头 logo 同源的圆形徽章。 -->
  <title id="icon-title">Antiona</title>
  <defs>
    <linearGradient id="brand-gradient" x1="14" y1="10" x2="114" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b5fd1"/>
      <stop offset="0.55" stop-color="#2f7cf6"/>
      <stop offset="1" stop-color="#58b8ff"/>
    </linearGradient>
    <linearGradient id="brand-sheen" x1="20" y1="118" x2="108" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.38"/>
